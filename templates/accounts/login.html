{% extends 'summarizer/base.html' %}

{% block title %}Login — IndoGist Studio{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card-editorial p-4 border-dotted-accent">
      <div class="text-center mb-4">
        <i class="fas fa-lock fa-2x text-warning mb-2"></i>
        <h3 class="clip-text-amber mb-1">User Login</h3>
        <p class="small text-muted mb-0">Sign in to access your saved history and preferences</p>
      </div>

      <form method="post" action="/accounts/login">
        {{ csrf_field(request) }}
        <div class="mb-3">
          <label for="id_username" class="form-label text-white small fw-bold">Username</label>
          <input
            type="text"
            name="username"
            id="id_username"
            class="form-control form-control-editorial"
            placeholder="Enter your username"
            value="{{ form.get('username', '') if hasattr(form, 'get') else '' }}"
            required
            autofocus
          />
        </div>

        <div class="mb-4">
          <label for="id_password" class="form-label text-white small fw-bold">Password</label>
          <input
            type="password"
            name="password"
            id="id_password"
            class="form-control form-control-editorial"
            placeholder="Enter your password"
            required
          />
        </div>

        <button type="submit" class="btn btn-editorial w-100 py-3 mb-3">
          <i class="fas fa-sign-in-alt me-2"></i> Sign In
        </button>
      </form>

      <p class="text-center small text-muted mb-0">
        Don't have an account?
        <a href="/accounts/register/" class="text-warning text-decoration-none fw-bold ms-1">Register here</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
