{% extends 'summarizer/base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card fade-in">
      <div class="card-body p-5">
        <div class="text-center mb-4">
          <i class="fas fa-sign-in-alt fa-3x text-primary mb-3"></i>
          <h2>Welcome Back!</h2>
          <label class="text-muted">Login to your account</label>
        </div>

        <form method="post" action="/accounts/login">
          <div class="mb-3">
            <label for="id_username" class="form-label fw-medium">Username</label>
            <input
              type="text"
              name="username"
              id="id_username"
              class="form-control form-control-lg"
              placeholder="Enter your username"
              value="{{ form.get('username', '') if hasattr(form, 'get') else '' }}"
              required
              autofocus
            />
          </div>

          <div class="mb-3">
            <label for="id_password" class="form-label fw-medium">Password</label>
            <input
              type="password"
              name="password"
              id="id_password"
              class="form-control form-control-lg"
              placeholder="Enter your password"
              required
            />
          </div>

          <button type="submit" class="btn btn-primary w-100 mb-3 mt-4">
            <i class="fas fa-sign-in-alt me-2"></i> Login
          </button>
        </form>

        <p class="text-center mb-0">
          <label>Don't have an account?</label>
          <a href="/accounts/register" class="text-decoration-none fw-bold ms-1">
            Register here
          </a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
