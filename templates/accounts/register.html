{% extends 'summarizer/base.html' %}

{% block title %}{{ lang("Register — IndoGist Studio") }}{% endblock %}

{% block content %}
<section class="view active" style="max-width: 480px; margin: 30px auto 0;">
  <div class="card">
    <div class="card-head">
      <p class="card-title">{{ lang("Create Account") }}</p>
    </div>
    <div class="card-body">
      <form method="post" action="/accounts/register">
        {{ csrf_field(request) }}
        
        <div style="margin-bottom: 14px;">
          <label class="field-label" for="username">{{ lang("Username") }}</label>
          <input type="text" name="username" id="username" class="field" style="min-height: 42px;" placeholder="{{ lang("Choose a username") }}" value="{{ form.get('username', '') if hasattr(form, 'get') else '' }}" required autofocus>
        </div>

        <div style="margin-bottom: 14px;">
          <label class="field-label" for="email">{{ lang("Email Address") }}</label>
          <input type="email" name="email" id="email" class="field" style="min-height: 42px;" placeholder="{{ lang("Enter your email address") }}" value="{{ form.get('email', '') if hasattr(form, 'get') else '' }}" required>
        </div>

        <div style="margin-bottom: 14px;">
          <label class="field-label" for="password1">{{ lang("Password") }}</label>
          <input type="password" name="password1" id="password1" class="field" style="min-height: 42px;" placeholder="{{ lang("Enter password") }}" required>
        </div>

        <div style="margin-bottom: 20px;">
          <label class="field-label" for="password2">{{ lang("Confirm Password") }}</label>
          <input type="password" name="password2" id="password2" class="field" style="min-height: 42px;" placeholder="{{ lang("Confirm password") }}" required>
        </div>

        <button type="submit" class="btn btn-amber btn-block">{{ lang("Register Account") }}</button>
      </form>

      <p style="text-align: center; font-size: 13px; color: var(--text-muted); margin-top: 16px; margin-bottom: 0;">
        {{ lang("Already have an account?") }}
        <a href="/accounts/login/" style="color: var(--accent-amber); text-decoration: none; font-weight: 600;">{{ lang("Login here") }}</a>
      </p>
    </div>
  </div>
</section>
{% endblock %}
