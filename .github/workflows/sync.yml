name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Select the branch to deploy to Hugging Face'
        required: true
        default: 'main'

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
          ref: ${{ github.event.inputs.branch || github.ref_name }}

      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force https://glaza:$HF_TOKEN@huggingface.co/spaces/glaza/indogist ${{ github.event.inputs.branch || github.ref_name }}:main
