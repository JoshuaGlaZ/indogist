[project]
name = "Indogist"
version = "0.1.0"
description = "A Python package for Indogist"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0,<2.0",
    "anyio>=4.3.0,<5.0",
    "babel>=2.14.0,<3.0",
    "cachetools>=5.3.0,<6.0",
    "fastapi[standard]>=0.110.0,<1.0",
    "httpx>=0.27.0,<1.0",
    "itsdangerous>=2.1.2,<3.0",
    "jinja2>=3.1.3,<4.0",
    "joblib>=1.3.0,<2.0",
    "nltk>=3.8.0,<4.0",
    "numpy>=1.24.0,<2.0",
    "pandas>=2.0.0,<3.0",
    "passlib[bcrypt]>=1.7.4,<2.0",
    "psycopg2-binary>=2.9.9,<3.0",
    "pydantic-settings>=2.2.1,<3.0",
    "pysastrawi>=1.2.0,<2.0",
    "pytest>=8.0.0,<9.0",
    "pytest-asyncio>=0.23.0,<1.0",
    "python-dotenv>=1.0.1,<2.0",
    "python-multipart>=0.0.9,<1.0",
    "rich>=13.0.0,<14.0",
    "scikit-learn>=1.3.0,<2.0",
    "slowapi>=0.1.9,<1.0",
    "sqlmodel>=0.0.16,<1.0",
    "stanza>=1.7.0,<2.0",
    "starsessions>=2.1.0,<3.0",
    "tensorflow-cpu>=2.15.0,<3.0",
    "uvicorn[standard]>=0.28.0,<1.0",
]

[project.scripts]
check-models = "ml.status:check_models"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "ml*"]


