{% extends 'summarizer/base.html' %}
{% from 'macros/forms.html' import render_form %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card fade-in">
      <div class="card-body p-5">
        <div class="text-center mb-4">
          <i class="fas fa-sign-in-alt fa-3x text-primary mb-3"></i>
          <h2>Welcome Back!</h2>
          <label class="text-muted">Login to your account</label>
        </div>

        <form method="post">
          {{ csrf_field(request) }}
          {{ render_form(form) }}
          <button type="submit" class="btn btn-primary w-100 mb-3 mt-4">
            <i class="fas fa-sign-in-alt"></i> Login
          </button>
        </form>

        <p class="text-center mb-0"><label>
          Don't have an account?
          <a href="{{ url('accounts:register') }}" class="text-decoration-none fw-bold">
            Register here
          </label>
          </a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
