{% extends 'summarizer/base.html' %}
{% from 'macros/forms.html' import render_form %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card fade-in">
      <div class="card-body p-5">
        <div class="text-center mb-4">
          <i class="fas fa-user-plus fa-3x text-primary mb-3"></i>
          <h2>Create Account</h2>
          <label class="text-muted">Join us to start summarizing</label>
        </div>

        <form method="post">
          {{ csrf_field(request) }}
          {{ render_form(form) }}
          <button type="submit" class="btn btn-primary w-100 mb-3 mt-4">
            <i class="fas fa-user-plus"></i> Create Account
          </button>
        </form>

        <p class="text-center mb-0"><label>
          Already have an account?
          <a href="{{ url('accounts:login') }}" class="text-decoration-none fw-bold">
            Login here
          </a></label>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
